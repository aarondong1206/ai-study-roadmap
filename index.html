<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保险×AI 成长看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body { margin: 0; }
/* Layout: a policy-schedule ledger. Summary band on top (progress + this week), phase timeline, then week rows like numbered policy lines. */
:root {
  --bg: #f3f6f7;
  --paper: #ffffff;
  --ink: #142a3a;
  --muted: #5b6e7b;
  --line: #d8e1e6;
  --accent: #0f5c7a;
  --accent-soft: #e2eef3;
  --done: #2f7d5b;
  --done-soft: #e3f1ea;
  --t-tech: #2d5fa8;
  --t-biz: #9a5b13;
  --t-ground: #6b4aa0;
  --t-work: #1f7a74;
  --t-review: #6a737b;
  --display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a21; --paper: #16242d; --ink: #e3ecf0; --muted: #93a6b2; --line: #2a3b46;
    --accent: #6cb8d6; --accent-soft: #1b3442; --done: #6cc79d; --done-soft: #183428;
    --t-tech: #86aef0; --t-biz: #e0a861; --t-ground: #b79ae6; --t-work: #6fcac2; --t-review: #a3adb5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a21; --paper: #16242d; --ink: #e3ecf0; --muted: #93a6b2; --line: #2a3b46;
  --accent: #6cb8d6; --accent-soft: #1b3442; --done: #6cc79d; --done-soft: #183428;
  --t-tech: #86aef0; --t-biz: #e0a861; --t-ground: #b79ae6; --t-work: #6fcac2; --t-review: #a3adb5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.head h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; letter-spacing: .01em; }
.head p { margin: 0; color: var(--muted); max-width: 62ch; }
.sync { font-size: 12px; color: var(--muted); }

/* summary band */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; }
@media (max-width: 760px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.big { font-family: var(--mono); font-size: 44px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--muted); margin-left: 4px; }
.bar { height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); border-radius: 99px; transition: width .3s; }
.stack { display: grid; gap: 12px; align-content: start; }
.tracks { display: grid; gap: 8px; }
.trk { display: grid; grid-template-columns: 3.2em minmax(0,1fr) 3.6em; gap: 10px; align-items: center; font-size: 13px; }
.trk .bar { height: 6px; }
.trk span:last-child { text-align: right; font-family: var(--mono); color: var(--muted); }

.now-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.now-head h2 { font-size: 22px; }
.week-code { font-family: var(--mono); font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }
.label { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* phases */
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ph { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; gap: 6px; min-width: 0; }
.ph:hover { border-color: var(--accent); }
.ph[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.ph b { font-family: var(--display); font-size: 15px; }
.ph .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toggle { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }

/* phase sections and weeks */
.phase-sec { display: grid; gap: 12px; scroll-margin-top: 12px; }
.phase-sec > header { display: grid; gap: 4px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); }
.phase-sec > header h2 { font-size: 21px; }
.phase-sec > header p { margin: 0; font-size: 13px; color: var(--muted); max-width: 70ch; }
.weeks { display: grid; gap: 0; }
.wk { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 560px) { .wk { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.wk.current { background: var(--accent-soft); margin-inline: -12px; padding-inline: 12px; border-radius: 8px; border-bottom-color: transparent; }
.wk-id { display: grid; gap: 2px; align-content: start; }
.wk-id .mono:first-child { font-size: 15px; font-weight: 500; }
.wk-id .mono + .mono { font-size: 12px; color: var(--muted); }
.wk-id .here { font-size: 11px; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.wk-body { display: grid; gap: 8px; min-width: 0; }
.wk-body h3 { font-family: var(--body); font-size: 16px; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.wk-body h3 .count { font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.wk-body h3 .count.all { color: var(--done); }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 22px 3.2em minmax(0, 1fr); gap: 8px; align-items: start; }
.task input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--done); cursor: pointer; }
.task input:disabled { cursor: default; }
.task label { cursor: pointer; }
.task.done label { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.tag { font-size: 12px; font-weight: 700; padding-top: 2px; }
.tag[data-t="学习"] { color: var(--t-tech); }
.tag[data-t="练习"] { color: var(--t-work); }
.tag[data-t="考证"] { color: var(--t-biz); }
.tag[data-t="复盘"] { color: var(--t-review); }
.res { display: inline-flex; gap: 4px; align-items: baseline; margin-left: 6px; font-size: 13px; color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); overflow-wrap: anywhere; }
.res:hover { border-bottom-color: var(--accent); }
.certs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .certs { grid-template-columns: minmax(0, 1fr); } }
.cert { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.cert.got { border-color: var(--done); background: var(--done-soft); }
.cert .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cert b { font-size: 15px; line-height: 1.4; }
.cert .fee { font-size: 13px; color: var(--muted); }
.stamp { font-size: 12px; font-weight: 700; color: var(--t-biz); }
.cert.got .stamp { color: var(--done); }
.opt { font-size: 13px; color: var(--muted); margin: 0; }
.opt a { color: var(--accent); }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.sec-title h2 { font-size: 21px; }
.out { font-size: 13px; color: var(--muted); }
.out b { font-weight: 500; color: var(--ink); }
details.note summary { font-size: 13px; color: var(--accent); cursor: pointer; width: fit-content; }
details.note textarea, .now textarea { width: 100%; min-height: 84px; resize: vertical; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 14px; }
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }
.now .tasks { margin-top: 4px; }
.foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>

<div class="wrap">
  <header class="head">
    <div class="eyebrow">2026-10-12 → 2027-10-10 · 52 周 · 每周约 8 小时</div>
    <h1>保险×AI 成长看板</h1>
    <p>两条线：考证，和 AI 技能学习（Python → 大模型 API 与提示词 → RAG → Agent）。每项学习任务都附了视频或课程链接，学完就打勾。</p>

  <section class="summary">

  <main id="list" class="stack" style="gap:36px"></main>

</div>

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") n.className = attrs[k];
    else if (k === "text") n.textContent = attrs[k];

    const d = tasks.filter(t => state.done[t.id]).length;
    return el("button", { class: "ph", type: "button", "aria-current": p === currentPhase ? "true" : "false",
      onclick: () => document.getElementById("sec-" + p.id).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }) },
      el("b", { text: p.name.replace("｜", " ") }),
      el("span", { class: "meta", text: `W${p.range[0]}–W${p.range[1]} · ${wkDate(p.range[0])}–${wkDate(p.range[1], true)}` }),
      el("div", { class: "bar" }, el("i", { style: `width:${tasks.length ? d / tasks.length * 100 : 0}%` })),
      el("span", { class: "meta", text: `${d}/${tasks.length}` }));
  }));
}

function renderFilters() {
  const f = document.getElementById("filters");
  const chips = [null, ...TRACKS].map(k => el("button", { class: "chip", type: "button", "aria-pressed": state.filter === k ? "true" : "false",
    text: k || "全部", onclick: () => { state.filter = k; renderFilters(); renderList(); } }));
  const hide = el("input", { type: "checkbox", id: "hide-done" }); hide.checked = state.hideDone;
  hide.addEventListener("change", () => { state.hideDone = hide.checked; renderList(); });
  f.replaceChildren(...chips, el("label", { class: "toggle", for: "hide-done" }, hide, "隐藏已完成"));
}

function renderList() {
  const main = document.getElementById("list");
  const secs = PLAN.phases.map(p => {
    const rows = PLAN.items.filter(it => it.w[0] >= p.range[0] && it.w[0] <= p.range[1]).map(it => {
      const idx = it.tasks.map((t, i) => i).filter(i => (!state.filter || it.tasks[i][0] === state.filter) && !(state.hideDone && state.done[taskId(it, i)]));
      if (!idx.length) return null;
      const n = it.tasks.filter((t, i) => state.done[taskId(it, i)]).length;
      const cur = it === currentItem;
      const [ta, msg] = noteBox(it, "note-");
      const note = el("details", { class: "note" }, el("summary", { text: state.notes[itemId(it)] ? "周复盘（已写）" : "写周复盘" }), ta, msg);
      return el("article", { class: "wk" + (cur ? " current" : ""), id: "wk-" + itemId(it) },
        el("div", { class: "wk-id" },
          el("span", { class: "mono", text: weekLabel(it) }),
          el("span", { class: "mono", text: `${wkDate(it.w[0])}–${wkDate(it.w[1], true)}` }),
          cur ? el("span", { class: "here", text: "本周" }) : null),
        el("div", { class: "wk-body" },
          el("h3", {}, it.theme, el("span", { class: "count" + (n === it.tasks.length ? " all" : ""), text: `${n}/${it.tasks.length}` })),
          el("ul", { class: "tasks" }, ...idx.map(i => taskRow(it, it.tasks[i], i))),
          note));
    }).filter(Boolean);
    return el("section", { class: "phase-sec", id: "sec-" + p.id },
      el("header", {}, el("h2", { text: p.name }), el("p", { text: "目标：" + p.goal }), el("p", { text: "验收：" + p.check })),
      rows.length ? el("div", { class: "weeks" }, ...rows) : el("p", { class: "out", text: "这一阶段没有符合筛选条件的任务。" }));
  });
  main.replaceChildren(...secs);
}

function renderCerts() {
  const box = document.getElementById("certs");
  box.replaceChildren(...PLAN.certs.map(c => {
    const got = !!(c.doneTask && state.done[c.doneTask]);
    const name = c.link ? el("a", { href: PLAN.links[c.link][1], target: "_blank", rel: "noopener", style: "color:inherit;text-decoration:none" }, c.name + " ↗") : c.name;
    return el("div", { class: "cert" + (got ? " got" : "") },
      el("span", { class: "stamp", text: got ? "已考" : `第 ${PLAN.certs.indexOf(c) + 1} 张 · 待考` }),
      el("b", {}, name),
      el("span", { class: "when", text: c.when }),
      el("span", { class: "fee", text: `${c.fee} · ${c.form}` }),
      el("span", { class: "fee", text: c.why }));
  }));
  document.getElementById("opts").textContent = "已持有：" + PLAN.owned + "。三张 AI 证书加上 LOMA，是国际保险证书、国际 AI 证书和国内 AI 证书的组合。费用和时间以官网为准。";
}

function renderAll() { renderSummary(); renderNow(); renderCerts(); renderPhases(); renderList(); }

/* ---------- writes ---------- */
async function toggle(id, on) {
  if (on) state.done[id] = new Date().toISOString(); else delete state.done[id];
  saveLocal();
  renderAll();
  if (state.mode !== "db") return;
  try {
    const ref = db.collection("checks").doc(id);
    if (on) await ref.set({ done: true, at: state.done[id] }); else await ref.delete();
  } catch (e) { setSync("保存失败：" + (e && e.code === "invalid_argument" ? "你没有编辑权限。" : "网络或服务暂时不可用，稍后再勾一次。")); }
}
async function saveNote(key, text, msg) {
  state.notes[key] = text; saveLocal();
  if (state.mode !== "db") { msg.textContent = "已保存在本设备"; return; }
  try {
    const ref = db.collection("notes").doc(key);
    if (text.trim()) await ref.set({ text, at: new Date().toISOString() }); else await ref.delete();
    msg.textContent = "已保存";
  } catch (e) { msg.textContent = "保存失败，请稍后再试"; }
}
function setSync(t) { document.getElementById("sync").textContent = t; }

/* ---------- connect ---------- */
async function connect() {
  const fallback = (why) => { state.mode = "local"; setSync(why); };
  if (!window.claude || typeof window.claude.use !== "function") return fallback("只保存在这台设备的浏览器里。");
  try {
    db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if (!db) return fallback("云端保存不可用，进度只保存在这台设备的浏览器里。");
    const owner = user ? await user.isOwner() : true;
    state.canWrite = owner !== false;
    state.mode = "db";
    setSync(state.canWrite ? "进度自动保存到云端，换设备打开也在。" : "只读查看：只有看板主人可以勾选。");
    db.collection("checks").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && v.done) next[d.id] = v.at || true; });
      state.done = next; saveLocal(); renderAll();
    }, () => setSync("和云端的连接断开了，刷新页面可重连。"));
    db.collection("notes").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const v = d.data(); if (v && v.text) next[d.id] = v.text; });
      const active = document.activeElement && document.activeElement.tagName === "TEXTAREA";
      state.notes = next; saveLocal(); if (!active) renderAll();
    }, () => {});
  } catch (e) { fallback("云端保存不可用，进度只保存在这台设备的浏览器里。"); }
}

loadLocal();
renderFilters();
renderAll();
connect();
</script>
