<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI学习计划">
  <title>AI 小白成长之路</title>
  <style>
    :root {
      --primary: #0f766e;
      --primary-2: #2563eb;
      --accent: #c2410c;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --bg: #f6f8f9;
      --card: #ffffff;
      --ink: #111827;
      --muted: #667085;
      --soft: #eef6f4;
      --line: #d8dee4;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 8px;
      --nav-h: 74px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    a,
    input,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: var(--primary-2);
      text-decoration: none;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      color: #fff;
      background: linear-gradient(135deg, #0f766e 0%, #2563eb 100%);
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.18);
    }

    .header-inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px 16px 14px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.84;
      line-height: 1.45;
    }

    .header-pill {
      flex: 0 0 auto;
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .overall {
      margin-top: 14px;
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
    }

    .overall-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 12px;
      opacity: 0.92;
    }

    .overall-meta strong {
      font-size: 16px;
      opacity: 1;
    }

    .bar {
      width: 100%;
      height: 7px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.24);
    }

    .bar > span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: #fff;
      transition: width 0.35s ease;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 12px 0;
    }

    .page { display: none; }
    .page.active { display: block; }

    .grid {
      display: grid;
      gap: 10px;
    }

    .stats-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card,
    .task-card,
    .resource-card,
    .phase-card,
    .log-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .card {
      padding: 14px;
      margin-bottom: 10px;
    }

    .metric {
      min-height: 86px;
      padding: 13px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .metric-value {
      margin-top: 5px;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 800;
    }

    .metric-hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 16px 2px 8px;
    }

    .section-title {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .tiny-link {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 5px;
    }

    .current-card {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .ring {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--primary) 0deg, var(--primary) var(--ring), #e6eceb var(--ring), #e6eceb 360deg);
    }

    .ring-inner {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fff;
      font-size: 18px;
      font-weight: 800;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
    }

    .card-text {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .chip-row,
    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar,
    .filter-row::-webkit-scrollbar { display: none; }

    .chip,
    .filter-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      padding: 8px 11px;
      white-space: nowrap;
    }

    .chip.active,
    .filter-btn.active {
      border-color: var(--primary);
      background: var(--soft);
      color: var(--primary);
    }

    .search-box {
      position: relative;
      margin: 0 0 10px;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input,
    .field,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }

    .search-input {
      padding: 11px 12px 11px 38px;
      font-size: 14px;
    }

    .field {
      padding: 10px 11px;
      font-size: 14px;
    }

    .textarea {
      min-height: 96px;
      padding: 10px 11px;
      resize: vertical;
      font-size: 14px;
      line-height: 1.55;
    }

    .search-input:focus,
    .field:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .phase-card {
      padding: 13px;
      margin-bottom: 10px;
    }

    .phase-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
    }

    .phase-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
    }

    .phase-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .phase-pct {
      color: var(--primary);
      font-size: 20px;
      font-weight: 800;
      white-space: nowrap;
    }

    .thin-bar {
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: #e6eceb;
    }

    .thin-bar span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width 0.35s ease;
    }

    .task-list {
      display: grid;
      gap: 9px;
    }

    .task-card {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr);
      gap: 10px;
      padding: 11px;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }

    .task-card.done {
      border-color: #bbf7d0;
      background: #f0fdf4;
    }

    .task-card:active { transform: scale(0.995); }

    .check-btn {
      width: 30px;
      height: 30px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      background: #fff;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      margin-top: 1px;
    }

    .task-card.done .check-btn {
      border-color: var(--success);
      background: var(--success);
    }

    .check-btn svg {
      width: 17px;
      height: 17px;
      stroke-width: 3;
    }

    .task-title {
      font-size: 14px;
      line-height: 1.42;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .task-card.done .task-title {
      color: #166534;
      text-decoration: line-through;
      text-decoration-color: #86efac;
    }

    .task-detail {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
    }

    .tag.primary {
      background: var(--soft);
      color: var(--primary);
    }

    .tag.warn {
      background: #fff7ed;
      color: var(--accent);
    }

    .task-links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 9px;
    }

    .link-btn,
    .action-btn,
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      padding: 10px 12px;
      border: 1px solid transparent;
    }

    .link-btn {
      min-height: 32px;
      padding: 8px 9px;
      border-color: #bfdbfe;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .action-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .action-btn.secondary {
      background: var(--primary-2);
      border-color: var(--primary-2);
    }

    .action-btn.danger {
      background: var(--danger);
      border-color: var(--danger);
    }

    .ghost-btn {
      width: 100%;
      background: #fff;
      color: var(--primary);
      border-color: var(--line);
    }

    .link-btn svg,
    .action-btn svg,
    .ghost-btn svg,
    .nav-btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }

    .form-grid {
      display: grid;
      gap: 10px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .resource-card {
      padding: 13px;
      margin-bottom: 9px;
    }

    .resource-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .resource-title {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .resource-desc {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .resource-card .link-btn {
      margin-top: 10px;
    }

    .log-card {
      padding: 12px;
      margin-bottom: 8px;
    }

    .log-date {
      font-size: 13px;
      font-weight: 800;
    }

    .log-note {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 32px 18px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      min-height: var(--nav-h);
      padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(14px);
    }

    .nav-btn {
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      min-width: 0;
      padding: 5px 2px;
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--soft);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
      z-index: 40;
      max-width: calc(100vw - 28px);
      transform: translateX(-50%) translateY(18px);
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      background: #111827;
      color: #fff;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 10px 28px rgba(17,24,39,0.25);
      transition: opacity 0.22s, transform 0.22s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 760px) {
      body { padding-bottom: 0; }
      .app-shell {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        max-width: 1180px;
        margin: 0 auto;
      }
      .app-header .header-inner { max-width: 1180px; }
      main { padding: 18px; }
      .bottom-nav {
        position: sticky;
        top: 138px;
        align-self: start;
        grid-template-columns: 1fr;
        min-height: 0;
        height: auto;
        margin: 18px 0 0 18px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      .nav-btn {
        min-height: 48px;
        flex-direction: row;
        justify-content: flex-start;
        padding: 10px 12px;
        font-size: 13px;
      }
      .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .desktop-two {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 12px;
      }
      .button-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="title-row">
        <div>
          <h1>AI 小白成长之路</h1>
          <div class="subtitle">从 Python 零基础到可落地的人工智能项目能力</div>
        </div>
        <div class="header-pill" id="stagePill">第 1 阶段</div>
      </div>
      <div class="overall" aria-label="总体学习进度">
        <div class="overall-meta">
          <span>总体进度 <strong id="overallPct">0%</strong></span>
          <span id="overallCount">0 / 0 项</span>
        </div>
        <div class="bar"><span id="overallBar"></span></div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <nav class="bottom-nav" aria-label="主导航">
      <button class="nav-btn active" data-page="dashboard" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3v10Z"/><path d="M13 21h8V11h-8v10Z"/><path d="M13 3v6h8V3h-8Z"/><path d="M3 21h8v-6H3v6Z"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-btn" data-page="plan" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/><path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>
        <span>路线</span>
      </button>
      <button class="nav-btn" data-page="today" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>今日</span>
      </button>
      <button class="nav-btn" data-page="resources" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <span>资源</span>
      </button>
      <button class="nav-btn" data-page="settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06A2 2 0 1 1 7.03 3.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.2.36.34.74.4 1.1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51.9Z"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <main>
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-plan"></section>
      <section class="page" id="page-today"></section>
      <section class="page" id="page-resources"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "aiStudyRoadmapProgress_v1";

    const phases = [
      {
        id: "python",
        order: 1,
        title: "Python 零基础入门",
        short: "Python",
        weeks: "第 1-6 周",
        targetHours: 42,
        goal: "能独立写 Python 小程序、读懂报错、使用 Jupyter。",
        output: "学习记账本或文件整理工具"
      },
      {
        id: "data",
        order: 2,
        title: "数据分析与科学计算",
        short: "数据",
        weeks: "第 7-10 周",
        targetHours: 28,
        goal: "能用 NumPy、pandas 和可视化工具完成一次 EDA。",
        output: "电商订单分析报告"
      },
      {
        id: "math",
        order: 3,
        title: "AI 必备数学",
        short: "数学",
        weeks: "第 11-18 周",
        targetHours: 56,

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return mergeState(defaultState(), saved || {});
      } catch (error) {
        return defaultState();
      }
    }

    function mergeState(base, incoming) {
      return {
        done: incoming.done || base.done,
        completedAt: incoming.completedAt || base.completedAt,
        logs: incoming.logs || base.logs,
        settings: Object.assign({}, base.settings, incoming.settings || {})
      };
    }

    let state = loadState();

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function phaseById(id) {
      return phases.find((phase) => phase.id === id);
    }

    function resourceById(id) {
      return resources.find((resource) => resource.id === id);
    }

    function phaseTasks(phaseId) {
      return tasks.filter((item) => item.phase === phaseId);
    }

    function doneTasks() {
      return tasks.filter((item) => state.done[item.id]);
    }

    function pct(done, total) {
      if (!total) return 0;
      return Math.round((done / total) * 100);
    }

    function phaseProgress(phaseId) {
      const list = phaseTasks(phaseId);
      const done = list.filter((item) => state.done[item.id]).length;
      const totalHours = list.reduce((sum, item) => sum + item.hours, 0);
      const doneHours = list.filter((item) => state.done[item.id]).reduce((sum, item) => sum + item.hours, 0);
      return { done, total: list.length, pct: pct(done, list.length), doneHours, totalHours };
    }

    function overallProgress() {
      const done = doneTasks().length;
      const total = tasks.length;
      const doneHours = doneTasks().reduce((sum, item) => sum + item.hours, 0);
      const totalHours = tasks.reduce((sum, item) => sum + item.hours, 0);
      return { done, total, pct: pct(done, total), doneHours, totalHours };
    }

    function currentPhaseData() {
      return phases.find((phase) => phaseProgress(phase.id).pct < 100) || phases[phases.length - 1];
    }

    function nextTask() {
      return tasks.find((item) => !state.done[item.id]) || null;
    }

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function daysBetween(a, b) {
      const start = new Date(a + "T00:00:00");
      const end = new Date(b + "T00:00:00");
      return Math.round((end - start) / 86400000);
    }

    function learnedMinutesTotal() {
      return Object.values(state.logs).reduce((sum, log) => sum + Number(log.minutes || 0), 0);
    }

    function streakDays() {
      let count = 0;
      const cursor = new Date();
      while (true) {
        const key = cursor.toISOString().slice(0, 10);
        if (!state.logs[key] || Number(state.logs[key].minutes || 0) <= 0) break;
        count += 1;
        cursor.setDate(cursor.getDate() - 1);
      }
      return count;
    }

    function htmlEscape(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function icon(name) {
      const icons = {
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>',
        external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>',
        save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>',
        download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>',
        upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
        search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3Z"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>'
      };
      return icons[name] || "";
    }

    function setPage(page) {
      currentPage = page;
      $$(".page").forEach((item) => item.classList.toggle("active", item.id === `page-${page}`));
      $$(".nav-btn").forEach((item) => item.classList.toggle("active", item.dataset.page === page));
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function renderHeader() {
      const overall = overallProgress();
      const phase = currentPhaseData();
      $("#overallPct").textContent = `${overall.pct}%`;
      $("#overallCount").textContent = `${overall.done} / ${overall.total} 项`;
      $("#overallBar").style.width = `${overall.pct}%`;
      $("#stagePill").textContent = `第 ${phase.order} 阶段`;
    }

    function renderCurrentPage() {
      renderHeader();
      if (currentPage === "dashboard") renderDashboard();
      if (currentPage === "plan") renderPlan();
      if (currentPage === "today") renderToday();
      if (currentPage === "resources") renderResources();
      if (currentPage === "settings") renderSettings();
    }

    function renderDashboard() {
      const overall = overallProgress();
      const phase = currentPhaseData();
      const phaseStat = phaseProgress(phase.id);
      const next = nextTask();
      const days = Math.max(1, daysBetween(state.settings.startDate, todayKey()) + 1);
      const learnedHours = learnedMinutesTotal() / 60;
      const expectedHours = (days / 7) * Number(state.settings.weeklyHours || 10);
      const speed = expectedHours ? Math.round((learnedHours / expectedHours) * 100) : 0;

      $("#page-dashboard").innerHTML = `
        <div class="grid stats-grid">
          ${metric("完成任务", `${overall.done}/${overall.total}`, `${overall.doneHours} / ${overall.totalHours} 小时`)}
          ${metric("当前阶段", phase.short, `${phaseStat.done}/${phaseStat.total} 项 · ${phaseStat.pct}%`)}
          ${metric("累计学习", `${Math.round(learnedHours * 10) / 10}h`, `按打卡记录统计`)}
          ${metric("连续打卡", `${streakDays()} 天`, `节奏参考 ${speed}%`)}
        </div>

        <div class="section-head">
          <h2 class="section-title">当前推进</h2>
          <button class="tiny-link" type="button" data-jump="plan">查看路线</button>
        </div>
        <div class="card current-card">
          <div class="ring" style="--ring:${phaseStat.pct * 3.6}deg">
            <div class="ring-inner">${phaseStat.pct}%</div>
          </div>
          <div>
            <h3 class="card-title">${htmlEscape(phase.title)}</h3>
            <p class="card-text">${htmlEscape(phase.goal)}</p>
            <div class="meta-line">
              <span class="tag primary">${phase.weeks}</span>
              <span class="tag">${phaseStat.doneHours}/${phaseStat.totalHours} 小时</span>
            </div>
          </div>
        </div>

        <div class="section-head">
          <h2 class="section-title">下一步</h2>
          <button class="tiny-link" type="button" data-jump="today">今日打卡</button>
        </div>
        ${next ? taskCard(next, { compact: true, showLinks: true }) : doneAllCard()}

        <div class="section-head">
          <h2 class="section-title">阶段总览</h2>
        </div>
        ${phases.map(phaseCard).join("")}
      `;
    }

    function metric(label, value, hint) {
      return `
        <div class="card metric">
          <div class="metric-label">${htmlEscape(label)}</div>
          <div class="metric-value">${htmlEscape(value)}</div>
          <div class="metric-hint">${htmlEscape(hint)}</div>
        </div>
      `;
    }

    function phaseCard(phase) {
      const stat = phaseProgress(phase.id);
      return `
        <article class="phase-card">
          <div class="phase-top">
            <div>
              <h3 class="phase-title">${phase.order}. ${htmlEscape(phase.title)}</h3>
              <div class="phase-meta">${htmlEscape(phase.weeks)} · ${htmlEscape(phase.output)}</div>
            </div>
            <div class="phase-pct">${stat.pct}%</div>
          </div>
          <div class="thin-bar"><span style="width:${stat.pct}%"></span></div>
        </article>
      `;
    }

    function renderPlan() {
      const phaseOptions = [{ id: "all", short: "全部" }].concat(phases);
      const search = $("#planSearch") ? $("#planSearch").value.trim().toLowerCase() : "";
      let list = tasks.slice();
      if (planPhase !== "all") list = list.filter((item) => item.phase === planPhase);
      if (planStatus === "todo") list = list.filter((item) => !state.done[item.id]);
      if (planStatus === "done") list = list.filter((item) => state.done[item.id]);
      if (search) {
        list = list.filter((item) =>
          [item.title, item.detail, item.type, phaseById(item.phase).title].join(" ").toLowerCase().includes(search)
        );
      }

      $("#page-plan").innerHTML = `
        <div class="search-box">
          ${icon("search")}
          <input class="search-input" id="planSearch" type="search" placeholder="搜索任务、阶段或类型" value="${htmlEscape(search)}">
        </div>
        <div class="filter-row">
          ${phaseOptions.map((phase) => `<button class="filter-btn ${planPhase === phase.id ? "active" : ""}" type="button" data-phase="${phase.id}">${htmlEscape(phase.short)}</button>`).join("")}
        </div>
        <div class="chip-row">
          ${statusButton("all", "全部")}
          ${statusButton("todo", "未完成")}
          ${statusButton("done", "已完成")}
        </div>
        <div class="task-list">
          ${list.length ? list.map((item) => taskCard(item, { showLinks: true })).join("") : empty("没有匹配的学习任务")}
        </div>
      `;
      $("#planSearch").addEventListener("input", renderPlan);
    }

    function statusButton(id, label) {
      return `<button class="chip ${planStatus === id ? "active" : ""}" type="button" data-status="${id}">${label}</button>`;
    }

    function taskCard(item, options = {}) {
      const done = Boolean(state.done[item.id]);
      const phase = phaseById(item.phase);
      const links = (item.resourceIds || []).map(resourceById).filter(Boolean);
      return `
        <article class="task-card ${done ? "done" : ""}">
          <button class="check-btn" type="button" data-task="${item.id}" aria-label="${done ? "标记未完成" : "标记完成"}">
            ${done ? icon("check") : ""}
          </button>
          <div>
            <div class="task-title">${htmlEscape(item.title)}</div>
            <div class="task-detail">${htmlEscape(item.detail)}</div>
            <div class="meta-line">
              <span class="tag primary">${htmlEscape(phase.short)}</span>
              <span class="tag">${htmlEscape(item.type)}</span>
              <span class="tag warn">${item.hours} 小时</span>
            </div>
            ${options.showLinks && links.length ? `
              <div class="task-links">
                ${links.slice(0, options.compact ? 2 : 4).map((resource) => `
                  <a class="link-btn" href="${resource.url}" target="_blank" rel="noopener">${icon("external")}<span>${htmlEscape(resource.title)}</span></a>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </article>
      `;
    }

    function doneAllCard() {
      return `
        <div class="card">
          <h3 class="card-title">所有任务已完成</h3>
          <p class="card-text">现在可以进入更深的专家方向，持续做论文复现、真实项目和开源贡献。</p>
        </div>
      `;
    }

    function renderToday() {
      const key = todayKey();
      const log = state.logs[key] || { minutes: "", note: "" };
      const next = nextTask();
      const recent = Object.entries(state.logs)
        .filter(([, value]) => Number(value.minutes || 0) > 0 || (value.note || "").trim())
        .sort((a, b) => b[0].localeCompare(a[0]))
        .slice(0, 7);

      $("#page-today").innerHTML = `
        <div class="card">
          <h2 class="card-title">${new Date().toLocaleDateString("zh-CN", { month: "long", day: "numeric", weekday: "long" })}</h2>
          <p class="card-text">本周目标 ${state.settings.weeklyHours} 小时 · 当前连续 ${streakDays()} 天</p>
          <div class="form-grid" style="margin-top:12px">
            <label>
              <span class="field-label">学习时长（分钟）</span>
              <input class="field" id="todayMinutes" type="number" min="0" step="5" value="${htmlEscape(log.minutes || "")}">
            </label>
            <label>
              <span class="field-label">今日笔记</span>
              <textarea class="textarea" id="todayNote" placeholder="写下今天学了什么、卡在哪里、明天做什么">${htmlEscape(log.note || "")}</textarea>
            </label>
          </div>
          <div class="button-row">
            <button class="action-btn" type="button" data-action="save-log">${icon("save")}<span>保存打卡</span></button>
            ${next ? `<button class="action-btn secondary" type="button" data-action="finish-next">${icon("check")}<span>完成下一项</span></button>` : ""}
          </div>
        </div>

        <div class="section-head">
          <h2 class="section-title">下一项任务</h2>
          <button class="tiny-link" type="button" data-jump="plan">全部任务</button>
        </div>
        ${next ? taskCard(next, { showLinks: true }) : doneAllCard()}

        <div class="section-head">
          <h2 class="section-title">最近打卡</h2>
        </div>
        ${recent.length ? recent.map(([date, item]) => `
          <article class="log-card">
            <div class="log-date">${date} · ${Number(item.minutes || 0)} 分钟</div>
            ${item.note ? `<div class="log-note">${htmlEscape(item.note)}</div>` : ""}
          </article>
        `).join("") : empty("还没有打卡记录")}
      `;
    }

    function renderResources() {
      const categories = ["all"].concat(Array.from(new Set(resources.map((item) => item.category))));
      const search = $("#resourceSearch") ? $("#resourceSearch").value.trim().toLowerCase() : "";
      let list = resources.slice();
      if (resourceCategory !== "all") list = list.filter((item) => item.category === resourceCategory);
      if (search) {
        list = list.filter((item) => [item.title, item.desc, item.category].join(" ").toLowerCase().includes(search));
      }

      $("#page-resources").innerHTML = `
        <div class="search-box">
          ${icon("search")}
          <input class="search-input" id="resourceSearch" type="search" placeholder="搜索课程、视频或文档" value="${htmlEscape(search)}">
        </div>
        <div class="filter-row">
          ${categories.map((category) => `
            <button class="filter-btn ${resourceCategory === category ? "active" : ""}" type="button" data-resource-category="${category}">
              ${category === "all" ? "全部" : htmlEscape(category)}
            </button>
          `).join("")}
        </div>
        <div>
          ${list.length ? list.map((item) => `
            <article class="resource-card">
              <div class="resource-top">
                <div>
                  <h3 class="resource-title">${htmlEscape(item.title)}</h3>
                  <p class="resource-desc">${htmlEscape(item.desc)}</p>
                </div>
                <span class="tag primary">${htmlEscape(item.category)}</span>
              </div>
              <a class="link-btn" href="${item.url}" target="_blank" rel="noopener">${icon("external")}<span>打开资源</span></a>
            </article>
          `).join("") : empty("没有匹配的资源")}
        </div>
      `;
      $("#resourceSearch").addEventListener("input", renderResources);
    }

    function renderSettings() {
      $("#page-settings").innerHTML = `
        <div class="card">
          <h2 class="card-title">学习节奏</h2>
          <div class="form-grid" style="margin-top:12px">
            <label>
              <span class="field-label">每周目标小时数</span>
              <input class="field" id="weeklyHours" type="number" min="1" max="80" step="1" value="${htmlEscape(state.settings.weeklyHours)}">
            </label>
            <label>
              <span class="field-label">开始日期</span>
              <input class="field" id="startDate" type="date" value="${htmlEscape(state.settings.startDate)}">
            </label>
          </div>
          <div class="button-row">
            <button class="action-btn" type="button" data-action="save-settings">${icon("save")}<span>保存设置</span></button>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">进度备份</h2>
          <p class="card-text">进度保存在当前浏览器。跨设备使用时，先导出，再在另一台设备导入。</p>
          <div class="button-row">
            <button class="ghost-btn" type="button" data-action="export">${icon("download")}<span>导出</span></button>
            <label class="ghost-btn" for="importFile">${icon("upload")}<span>导入</span></label>
            <input class="sr-only" id="importFile" type="file" accept="application/json,.json">
            <button class="action-btn danger" type="button" data-action="reset">${icon("trash")}<span>重置</span></button>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">项目文件</h2>
          <p class="card-text">当前网页适合直接上传到 GitHub Pages，入口文件是 index.html。</p>
          <div class="task-links">
            <a class="link-btn" href="./AI小白到专家学习手册.md" target="_blank" rel="noopener">${icon("external")}<span>学习手册</span></a>
            <a class="link-btn" href="./README.md" target="_blank" rel="noopener">${icon("external")}<span>README</span></a>
          </div>
        </div>
      `;
      $("#importFile").addEventListener("change", importProgress);
    }

    function empty(text) {
      return `<div class="empty">${htmlEscape(text)}</div>`;
    }

    function toggleTask(id) {
      if (state.done[id]) {
        delete state.done[id];
        delete state.completedAt[id];
        toast("已取消完成");
      } else {
        state.done[id] = true;
        state.completedAt[id] = new Date().toISOString();
        toast("已标记完成");
      }
      saveState();
      renderCurrentPage();
    }

    function saveTodayLog() {
      const key = todayKey();
      const minutes = Number($("#todayMinutes").value || 0);
      const note = $("#todayNote").value.trim();
      state.logs[key] = { minutes, note, updatedAt: new Date().toISOString() };
      saveState();
      toast("打卡已保存");
      renderCurrentPage();
    }

    function finishNextTask() {
      const next = nextTask();
      if (!next) return;
      state.done[next.id] = true;
      state.completedAt[next.id] = new Date().toISOString();
      saveState();
      toast("下一项已完成");
      renderCurrentPage();
    }

    function saveSettings() {
      state.settings.weeklyHours = Number($("#weeklyHours").value || 10);
      state.settings.startDate = $("#startDate").value || todayKey();
      saveState();
      toast("设置已保存");
      renderCurrentPage();
    }

    function exportProgress() {
      const payload = {
        app: "AI小白成长之路",
        version: 1,
        exportedAt: new Date().toISOString(),
        state
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ai-study-progress-${todayKey()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("进度已导出");
    }

    function importProgress(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const payload = JSON.parse(reader.result);
          state = mergeState(defaultState(), payload.state || payload);
          saveState();
          toast("进度已导入");
          renderCurrentPage();
        } catch (error) {
          toast("导入失败");
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    function resetProgress() {
      if (!confirm("确定要重置所有进度和打卡记录吗？")) return;
      state = defaultState();
      saveState();
      toast("进度已重置");
      renderCurrentPage();
    }

    function toast(text) {
      const node = $("#toast");
      node.textContent = text;
      node.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => node.classList.remove("show"), 1600);
    }

    document.addEventListener("click", (event) => {
      const nav = event.target.closest("[data-page]");
      if (nav) {
        setPage(nav.dataset.page);
        return;
      }

      const jump = event.target.closest("[data-jump]");
      if (jump) {
        setPage(jump.dataset.jump);
        return;
      }

      const taskBtn = event.target.closest("[data-task]");
      if (taskBtn) {
        toggleTask(taskBtn.dataset.task);
        return;
      }

      const phaseBtn = event.target.closest("[data-phase]");
      if (phaseBtn) {
        planPhase = phaseBtn.dataset.phase;
        renderPlan();
        return;
      }

      const statusBtn = event.target.closest("[data-status]");
      if (statusBtn) {
        planStatus = statusBtn.dataset.status;
        renderPlan();
        return;
      }

      const resourceBtn = event.target.closest("[data-resource-category]");
      if (resourceBtn) {
        resourceCategory = resourceBtn.dataset.resourceCategory;
        renderResources();
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;
      const name = action.dataset.action;
      if (name === "save-log") saveTodayLog();
      if (name === "finish-next") finishNextTask();
      if (name === "save-settings") saveSettings();
      if (name === "export") exportProgress();
      if (name === "reset") resetProgress();
    });

    renderCurrentPage();
  </script>
</body>
</html>
