<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保险×AI 成长看板</title>
<style>
body { margin: 0; }
/* Layout: iOS-style single column (Today large title, week strip, rings card, inset grouped task list), with a 全年 tab for the overview. */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --fill: #f2f2f7;
  --text: #1d1d1f;
  --text2: #6e6e73;
  --text3: #aeaeb2;
  --sep: rgba(60, 60, 67, 0.14);
  --blue: #007aff;
  --green: #34c759;
  --orange: #ff9500;
  --purple: #af52de;
  --pink: #ff2d55;
  --gray: #8e8e93;
  --track: rgba(120, 120, 128, 0.14);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --text: #f5f5f7; --text2: #98989d; --text3: #636366;
    --sep: rgba(84, 84, 88, 0.6); --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --purple: #bf5af2;
    --pink: #ff375f; --gray: #8e8e93; --track: rgba(120, 120, 128, 0.32); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --text: #f5f5f7; --text2: #98989d; --text3: #636366;
  --sep: rgba(84, 84, 88, 0.6); --blue: #0a84ff; --green: #30d158; --orange: #ff9f0a; --purple: #bf5af2;
  --pink: #ff375f; --gray: #8e8e93; --track: rgba(120, 120, 128, 0.32); --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.stack { display: grid; gap: 20px; min-width: 0; }
.app { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 56px; display: grid; gap: 20px; }

/* header */
.top { display: grid; gap: 2px; padding-top: 8px; }
.top-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date-label { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .02em; }
.large-title { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; margin: 0; line-height: 1.15; }
.today-btn { border: 0; background: none; color: var(--blue); font-size: 17px; padding: 6px 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--track); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 6px 0; font-size: 13px; font-weight: 600; color: var(--text); }
.seg button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* week strip */
.week { display: grid; grid-template-columns: 28px repeat(7, minmax(0, 1fr)) 28px; align-items: center; gap: 2px; }
.chev { border: 0; background: none; color: var(--blue); font-size: 22px; line-height: 1; padding: 6px 0; }
.chev:disabled { color: var(--text3); cursor: default; }
.day { border: 0; background: none; display: grid; justify-items: center; gap: 4px; padding: 4px 0; }
.day .wd { font-size: 11px; font-weight: 600; color: var(--text2); }
.day .num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--round); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; position: relative; }
.day.is-today .num { color: var(--pink); }
.day[aria-current="date"] .num { background: var(--text); color: var(--bg); }
.day.is-today[aria-current="date"] .num { background: var(--pink); color: #fff; }
.day .dot { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
.day.done .dot { background: var(--green); }
.day.part .dot { background: var(--orange); }
.day.off .num { color: var(--text3); }

/* cards */
.card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); }
.rings-card { padding: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; }
.rings { width: 108px; height: 108px; }
.stats { display: grid; gap: 8px; }
.stat { display: grid; gap: 0; }
.stat .k { font-size: 13px; font-weight: 600; }
.stat .v { font-family: var(--round); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat .v small { font-size: 15px; color: var(--text2); font-weight: 600; }
.k-today { color: var(--pink); } .k-week { color: var(--green); } .k-year { color: var(--blue); }

.section-head { display: flex; justify-content: space-between; align-items: baseline; padding-inline: 4px; gap: 12px; }
.section-head h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.section-head span { font-size: 15px; color: var(--text2); }

.list { padding: 0; margin: 0; list-style: none; overflow: hidden; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; align-items: start; position: relative; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); transform-origin: top; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--text3); background: none; padding: 0; display: grid; place-items: center; margin-top: 1px; transition: background .18s, border-color .18s, transform .12s; }
.check:active { transform: scale(.9); }
.check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s; }
.row.done .check { background: var(--c); border-color: var(--c); }
.row.done .check svg { opacity: 1; }
.check:disabled { cursor: default; }
.row-main { display: grid; gap: 3px; min-width: 0; }
.row-title { font-size: 17px; font-weight: 600; line-height: 1.3; }
.row.done .row-title { color: var(--text2); }
.row-detail { font-size: 15px; color: var(--text2); line-height: 1.35; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.pill { font-size: 12px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); padding: 2px 8px; border-radius: 999px; }
.mins { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
.open { align-self: center; text-decoration: none; font-size: 15px; font-weight: 600; color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, transparent); padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
.open:active { opacity: .7; }
.rest { padding: 28px 16px; text-align: center; color: var(--text2); display: grid; gap: 4px; }
.rest b { color: var(--text); font-size: 20px; }

.note { padding: 14px 16px; display: grid; gap: 8px; }
.note label { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .02em; }
.note textarea { width: 100%; min-height: 76px; border: 0; background: var(--fill); border-radius: 10px; padding: 10px 12px; font-size: 16px; resize: vertical; }
.note textarea:focus { outline: 2px solid color-mix(in srgb, var(--blue) 45%, transparent); }
.saved { font-size: 13px; color: var(--text2); min-height: 1em; }

.cert-card { padding: 4px 0; }
.cert-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 12px 16px; align-items: center; position: relative; text-decoration: none; color: inherit; }
.cert-row + .cert-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.cert-row b { font-size: 16px; font-weight: 600; display: block; }
.cert-row span { font-size: 13px; color: var(--text2); }
.days-left { font-family: var(--round); font-size: 20px; font-weight: 700; color: var(--orange); text-align: right; font-variant-numeric: tabular-nums; line-height: 1.1; }
.days-left small { display: block; font-family: var(--font); font-size: 11px; color: var(--text2); font-weight: 600; }
.days-left.got { color: var(--green); }

/* year view */
.phase { display: grid; gap: 8px; }
.phase-head { padding-inline: 4px; display: grid; gap: 2px; }
.phase-head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.phase-head p { margin: 0; font-size: 14px; color: var(--text2); }
.wk-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 60px; gap: 10px; align-items: center; padding: 12px 16px; border: 0; background: none; width: 100%; text-align: left; position: relative; }
.wk-row + .wk-row::before { content: ""; position: absolute; top: 0; left: 70px; right: 0; height: 1px; background: var(--sep); transform: scaleY(.5); }
.wk-no { font-family: var(--round); font-weight: 700; font-size: 15px; color: var(--text2); }
.wk-row.cur .wk-no { color: var(--pink); }
.wk-t { font-size: 16px; font-weight: 600; }
.wk-d { font-size: 13px; color: var(--text2); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
.wk-p { font-size: 12px; color: var(--text2); text-align: right; margin-top: 4px; font-variant-numeric: tabular-nums; }
.foot { font-size: 13px; color: var(--text2); padding-inline: 4px; line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .check, .check svg { transition: none; } }
</style>
</head>

<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <div class="date-label" id="dateLabel"></div>
        <h1 class="large-title" id="bigTitle">今天</h1>
      </div>
      <button class="today-btn" id="backToday" type="button" hidden>回到今天</button>
    </div>
  </header>

  <div class="seg" role="tablist" aria-label="视图">
    <button type="button" role="tab" id="tab-day" aria-selected="true">每日</button>
    <button type="button" role="tab" id="tab-year" aria-selected="false">全年</button>
  </div>

  <section id="view-day" class="stack">
    <nav class="week" id="week" aria-label="本周日期"></nav>

    <div class="card rings-card">
      <svg class="rings" id="rings" viewBox="0 0 108 108" role="img" aria-label="进度圆环"></svg>
      <div class="stats" id="stats"></div>
    </div>

    <div class="section-head"><h2 id="listTitle">今日任务</h2><span id="listMeta"></span></div>
    <ul class="card list" id="tasks"></ul>

    <div class="card note">
      <label for="dayNote" id="noteLabel">今日笔记</label>
      <textarea id="dayNote" placeholder="学到了什么、哪里没懂"></textarea>
      <div class="saved" id="noteSaved"></div>
    </div>

    <div class="section-head"><h2>证书</h2><span id="owned"></span></div>
    <div class="card cert-card" id="certs"></div>
  </section>

  <section id="view-year" class="stack" style="gap:28px" hidden></section>

  <p class="foot" id="sync">正在连接保存服务…</p>
</div>

function localISO(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parse(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(iso, n) { const d = parse(iso); d.setDate(d.getDate() + n); return localISO(d); }
function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);

}

function tid(date, i) { return date + "-" + (i + 1); }
function realTasks(day) { return day.tasks.map((t, i) => ({ ...t, id: tid(day.date, i) })).filter(t => t.k !== "休息"); }

function daysOfWeek(w) { return DAYS.filter(d => d.w === w); }

function fmtDate(iso, withWd) {
  const d = parse(iso);
  return `${d.getMonth() + 1}月${d.getDate()}日` + (withWd ? ` 星期${WD[d.getDay()]}` : "");
}

function streak() {
  let s = 0, cur = TODAY;
  const p0 = dayProgress(DAYS[byDate[cur]]);
  if (!(p0.total && p0.n === p0.total)) cur = addDays(cur, -1);
  while (byDate[cur] !== undefined) {
    const p = dayProgress(DAYS[byDate[cur]]);
    if (p.total === 0) { cur = addDays(cur, -1); continue; }
    if (p.n === p.total) { s++; cur = addDays(cur, -1); } else break;
  }
  return s;
}

function ringPath(r, frac, color, sw) {
  const g = svg("g", {});
  const c = 2 * Math.PI * r;
  g.append(svg("circle", { cx: 54, cy: 54, r, fill: "none", stroke: "var(--track)", "stroke-width": sw }));

  return g;
}

function renderCerts() {
  document.getElementById("owned").textContent = "已持有 " + DATA.owned;
  const keys = ["ACA", "AI901", "ACP"];
  const box = document.getElementById("certs");
  box.replaceChildren(...DATA.certs.map((c, i) => {
    const examDate = DATA.exams[keys[i]];
    const got = !!(c.doneTaskDate && state.done[c.doneTaskDate]);
    const left = diffDays(REAL_TODAY, examDate);
    return el("a", { class: "cert-row", href: DATA.links[c.link][1], target: "_blank", rel: "noopener" },
      el("div", {}, el("b", { text: c.name }), el("span", { text: `建议考试日 ${fmtDate(examDate)} · ${c.fee}` })),
      got ? el("div", { class: "days-left got" }, "已考", el("small", { text: "完成" }))
          : el("div", { class: "days-left" }, left >= 0 ? String(left) : "—", el("small", { text: left >= 0 ? "天后" : "已过" })));
  }));
}

function renderDay() { renderHeader(); renderWeek(); renderRings(); renderTasks(); renderNote(); renderCerts(); }

/* ---------- year view ---------- */
function renderYear() {
  const box = document.getElementById("view-year");
  const curW = weekOf(TODAY);
  box.replaceChildren(...DATA.phases.map(ph => {
    const rows = [];
    for (let w = ph.range[0]; w <= ph.range[1]; w++) {
      const ds = daysOfWeek(w);
      const p = ds.map(dayProgress).reduce((a, x) => ({ n: a.n + x.n, total: a.total + x.total }), { n: 0, total: 0 });
      rows.push(el("button", { class: "wk-row" + (w === curW ? " cur" : ""), type: "button", onclick: () => { state.sel = w === curW ? TODAY : ds[0].date; setView("day"); } },
        el("span", { class: "wk-no", text: "W" + w }),
        el("div", {}, el("div", { class: "wk-t", text: DATA.themes[w] || "" }), el("div", { class: "wk-d", text: `${fmtDate(ds[0].date)} – ${fmtDate(ds[ds.length - 1].date)}` })),
        el("div", {}, el("div", { class: "bar" }, el("i", { style: `width:${p.total ? p.n / p.total * 100 : 0}%` })), el("div", { class: "wk-p", text: `${p.n}/${p.total}` }))));
    }
    return el("section", { class: "phase" },
      el("div", { class: "phase-head" }, el("h3", { text: ph.name.replace("｜", " · ") }), el("p", { text: ph.goal })),
      el("div", { class: "card", style: "overflow:hidden" }, ...rows));
  }));
}

function setView(v) {
  state.view = v;
  document.getElementById("tab-day").setAttribute("aria-selected", v === "day");
  document.getElementById("tab-year").setAttribute("aria-selected", v === "year");
  document.getElementById("view-day").hidden = v !== "day";
  document.getElementById("view-year").hidden = v !== "year";
  if (v === "year") renderYear(); else renderDay();
  renderHeader();
  window.scrollTo(0, 0);
}

/* ---------- writes ---------- */
async function toggle(id, on) {
  if (on) state.done[id] = new Date().toISOString(); else delete state.done[id];
  saveLocal(); renderDay();
  if (state.mode !== "db") return;
  try {
    const ref = db.collection("dchecks").doc(id);
    if (on) await ref.set({ done: true, at: state.done[id] }); else await ref.delete();
  } catch (e) { setSync("这次勾选没有保存到云端，请稍后再点一次。"); }
}
let noteTimer = null;
function onNoteInput() {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(commitNote, 1000);
}
async function commitNote() {
  clearTimeout(noteTimer);
  const date = state.sel, text = document.getElementById("dayNote").value;
  if ((state.notes[date] || "") === text) return;
  state.notes[date] = text; saveLocal();
  const msg = document.getElementById("noteSaved");
  if (state.mode !== "db") { msg.textContent = "已保存在本设备"; return; }
  try {
    const ref = db.collection("dnotes").doc(date);
    if (text.trim()) await ref.set({ text, at: new Date().toISOString() }); else await ref.delete();
    msg.textContent = "已保存";
  } catch (e) { msg.textContent = "保存失败，请稍后再试"; }
}
function setSync(t) { document.getElementById("sync").textContent = t; }

async function connect() {
  const fallback = t => { state.mode = "local"; setSync(t); };
  if (!window.claude || typeof window.claude.use !== "function") return fallback("进度保存在这台设备的浏览器里。");
  try {
    db = await window.claude.use("db");
    const user = await window.claude.use("user");
    if (!db) return fallback("云端保存不可用，进度只保存在这台设备的浏览器里。");
    const owner = user ? await user.isOwner() : true;
    state.canWrite = owner !== false; state.mode = "db";
    setSync(state.canWrite ? "进度自动保存到云端，手机和电脑打开都能看到。" : "只读查看：只有看板主人可以打卡。");
    db.collection("dchecks").onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.done) next[d.id] = v.at || true; });
      state.done = next; saveLocal(); if (state.view === "day") renderDay(); else renderYear();
    }, () => setSync("和云端的连接断开了，刷新页面可以重新连接。"));
    db.collection("dnotes").onSnapshot(snap => {
      const next = {}; snap.docs.forEach(d => { const v = d.data(); if (v && v.text) next[d.id] = v.text; });
      state.notes = next; saveLocal(); if (state.view === "day") renderNote();
    }, () => {});
  } catch (e) { fallback("云端保存不可用，进度只保存在这台设备的浏览器里。"); }
}

document.getElementById("tab-day").addEventListener("click", () => setView("day"));
document.getElementById("tab-year").addEventListener("click", () => setView("year"));
document.getElementById("backToday").addEventListener("click", () => { state.sel = TODAY; renderDay(); });
const noteEl = document.getElementById("dayNote");
noteEl.addEventListener("input", onNoteInput);
noteEl.addEventListener("blur", commitNote);
document.addEventListener("keydown", e => {
  if (state.view !== "day" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft" && state.sel > FIRST) { state.sel = addDays(state.sel, -1); renderDay(); }
  if (e.key === "ArrowRight" && state.sel < LAST) { state.sel = addDays(state.sel, 1); renderDay(); }
});

loadLocal();
renderDay();
connect();
</script>
